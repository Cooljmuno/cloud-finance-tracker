name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: finance_tracker_test
          POSTGRES_USER: finance_tracker
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_tracker -d finance_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_DB: finance_tracker_test
      POSTGRES_USER: finance_tracker
      POSTGRES_PASSWORD: test_only_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.11.33"
      - run: uv sync --frozen
      - run: uv run ruff check . ../scripts/aws
      - run: uv run ruff format --check . ../scripts/aws
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest --cov=apps --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.7"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate state bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -lockfile=readonly -input=false
          terraform validate
          terraform test -no-color
      - name: Validate application infrastructure
        working-directory: infra/aws
        run: |
          terraform init -backend=false -lockfile=readonly -input=false
          terraform validate
          terraform test -no-color
      - name: Verify deployment safeguards without AWS access
        run: python -m unittest discover -s scripts/aws/tests -p 'test_*.py' -v

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, infrastructure]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build --target production --tag finance-tracker-api:test backend
      - run: docker build --target build --tag finance-tracker-web:test frontend


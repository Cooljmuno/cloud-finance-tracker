[project]
name = "cloud-finance-tracker-api"
version = "0.1.0"
description = "Django REST API for the Cloud Finance Tracker"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2.17,<5.3",
    "django-cors-headers>=4.7,<5",
    "djangorestframework>=3.18,<3.19",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6,<8",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "-ra --strict-config --strict-markers"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*"]

[tool.ruff]
extend-exclude = ["**/migrations/*.py"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP"]
